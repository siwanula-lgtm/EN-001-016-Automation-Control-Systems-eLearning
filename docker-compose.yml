    image: en-001-016-automation-elearning:latest
    container_name: en-001-016-automation-elearning
    ports:
      - "8050:3000"
    restart: unless-stopped
    volumes:
      - visitor-stats:/app/data   # เก็บสถิติการเข้าใช้ถาวร ไม่หายเมื่อ build ใหม่

volumes:
  visitor-stats:
